name: _scrape (reusable)

# Reusable scrape job. Each product workflow (scrape-monitor / scrape-flyway /
# scrape-flyway-desktop) calls this with its product key. When the scrape finds
# new content, a pull request is opened so the new entries can be
# reviewed/curated before they go live (the "hybrid" model).

on:
  workflow_call:
    inputs:
      product:
        description: "Product key (monitor | flyway | flywaydesktop)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape ${{ inputs.product }}
        id: scrape
        run: node scripts/scrape.js ${{ inputs.product }}

      - name: Open / update review pull request
        if: steps.scrape.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/${{ inputs.product }}.json
          branch: auto/scrape-${{ inputs.product }}
          base: main
          delete-branch: true
          commit-message: "chore(${{ inputs.product }}): sync release-notes entries"
          title: "📝 Review: ${{ steps.scrape.outputs.added }} new ${{ inputs.product }} release-notes entr(y/ies)"
          labels: |
            release-notes
            needs-review
          body: |
            The daily scraper picked up changes from the **${{ inputs.product }}** release notes.

            - **New entries added:** ${{ steps.scrape.outputs.added }}
            - **Awaiting review:** ${{ steps.scrape.outputs.needs_review }}

            ### Curation checklist
            If any entries are awaiting review, for each one with `"status": "needs-review"`
            in `data/${{ inputs.product }}.json`:
            - [ ] Confirm it is genuinely a feature/change worth listing (delete noise)
            - [ ] Tidy the `text` wording if needed
            - [ ] Fill product-specific tags (Monitor: `platforms`/`edition`)
            - [ ] Change `"status"` to `"curated"`

            Products configured with `autoCurate` (e.g. Flyway) skip this gate — their new
            entries already land as `curated`, so a zero count above is expected.

            Merging this PR triggers a rebuild and redeploy of the published pages.
